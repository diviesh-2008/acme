spring:
  application:
    name: salary-management

  # Defaults target a local development database (see db/local-setup.sql).
  # Override with environment variables in any shared or deployed environment.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/acme_salary}
    username: ${DB_USERNAME:acme}
    password: ${DB_PASSWORD:acme}

  jpa:
    # Keep persistence inside the service layer; no lazy loading during view rendering.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
