spring:
  application:
    name: salary-management

  # Credentials come only from the environment (see db/local-setup.sql for local setup).
  datasource:
    url: ${ACME_DB_URL:jdbc:mysql://localhost:3306/acme_salary}
    username: ${ACME_DB_USERNAME:}
    password: ${ACME_DB_PASSWORD:}
    hikari:
      data-source-properties:
        # Lets the MySQL driver send JDBC batches (e.g. the dev seed) as multi-row inserts.
        rewriteBatchedStatements: true

  jpa:
    # Keep persistence inside the service layer; no lazy loading during view rendering.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  jackson:
    deserialization:
      # Reject unknown JSON fields (400) instead of silently ignoring them, e.g. an
      # effectiveDate sent with a salary correction, or a client-supplied id.
      fail-on-unknown-properties: true

server:
  # Local default; hosting platforms (e.g. Render) inject the port they route to.
  port: ${PORT:8080}
  error:
    include-stacktrace: never

acme:
  security:
    cors:
      # Browser origins allowed to call the API cross-origin, comma-separated.
      # Empty (the default) means no CORS headers at all, which is what local
      # development needs: `ng serve` proxies /api, so requests are same-origin.
      allowed-origins: ${ACME_ALLOWED_ORIGINS:}

    jwt:
      # Required, no default. At least 32 bytes, e.g. generated with `openssl rand -base64 48`.
      secret: ${ACME_JWT_SECRET:}
      ttl: 1h
      issuer: acme-salary-management

  # Optional. On startup, creates this HR Manager account if it does not exist yet.
  initial-hr:
    email: ${ACME_INITIAL_HR_EMAIL:}
    password: ${ACME_INITIAL_HR_PASSWORD:}

  seed:
    # Demo data; enabled only by the dev profile (application-dev.yml).
    enabled: false
